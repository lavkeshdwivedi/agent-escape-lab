name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-syntax:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint evals/ with ruff
        run: ruff check evals/

      - name: Syntax-check experiment scripts
        run: >-
          python -c "import ast, pathlib;
          [ast.parse(f.read_text()) for f in pathlib.Path('experiments').glob('*.py')]"

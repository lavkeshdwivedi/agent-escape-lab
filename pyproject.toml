[project]
name = "agent-escape-evals"
version = "0.1.0"
description = "Inspect AI evaluations for autonomous agent escape vector behaviors"
requires-python = ">=3.10"
dependencies = [
    "inspect-ai>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals"]
